<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INSPIRATION</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="nav-links">
      <a href="index.html" class="music-nav">Home</a>
      <a href="music.html" class="music-nav">Music</a>
    </div>

    <a href="merch.html" class="merch-nav">
      <img src="images/merch-button.png" alt="Merch">
    </a>
  </nav>

  <section class="inspiration">
    <h1 class="inspiration-heading">INSPIRATION</h1>
    <p class="inspiration-tagline">The records, voices and moments behind the sound.</p>

    <div class="inspo-filters" role="group" aria-label="Filter inspiration" hidden>
      <button type="button" class="inspo-filter active" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="inspo-filter" data-filter="album" aria-pressed="false">Albums</button>
      <button type="button" class="inspo-filter" data-filter="artist" aria-pressed="false">Artists</button>
      <button type="button" class="inspo-filter" data-filter="performance" aria-pressed="false">Performances</button>
      <button type="button" class="inspo-filter" data-filter="other" aria-pressed="false">Other</button>
    </div>

    <!-- Cards come from data/inspiration.json. Edit them at admin.html. -->
    <ul class="inspo-grid"></ul>

    <p class="inspo-empty" hidden><span class="coming-soon">Coming Soon</span></p>
  </section>

  <script src="inspiration.js"></script>
  <script>
    (function () {
      const grid = document.querySelector('.inspo-grid');
      const filterBar = document.querySelector('.inspo-filters');
      const filters = document.querySelectorAll('.inspo-filter');

      function setUpFilters() {
        const items = grid.querySelectorAll('.inspo');

        filters.forEach(function (btn) {
          const type = btn.dataset.filter;

          // Hide filters that have nothing to show yet
          if (type !== 'all' && !grid.querySelector('.inspo[data-type="' + type + '"]')) {
            btn.hidden = true;
            return;
          }

          btn.addEventListener('click', function () {
            filters.forEach(function (b) {
              b.classList.toggle('active', b === btn);
              b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
            });
            items.forEach(function (item) {
              item.hidden = type !== 'all' && item.dataset.type !== type;
            });
          });
        });

        filterBar.hidden = false;
      }

      fetch('data/inspiration.json?v=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.json() : []; })
        .catch(function () { return []; })
        .then(function (entries) {
          if (!Array.isArray(entries) || !entries.length) {
            document.querySelector('.inspo-empty').hidden = false;
            return;
          }
          entries.forEach(function (entry) {
            grid.appendChild(buildInspoCard(entry));
          });
          setUpFilters();
        });
    })();
  </script>

</body>
</html>
