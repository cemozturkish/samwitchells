<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Sam Witchells">
  <title>SAM WITCHELLS</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" as="image" href="assets/logo.webp">
  <link rel="stylesheet" href="home.css">
</head>

<body>

  <main class="stage">
    <canvas class="logo-live" aria-hidden="true"></canvas>
    <h1 class="logo" id="logo">
      <img class="logo-still" src="assets/logo.webp" width="2048" height="1024" alt="Sam Witchells" draggable="false">
    </h1>
  </main>

  <a class="listen" id="listen" href="https://open.spotify.com/artist/6l9XfgZUomTnrQRodH0gWF" target="_blank" rel="noopener" aria-label="Sam Witchells on Spotify">
    <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" focusable="false">
      <defs>
        <!-- Polished chrome: hard light and dark bands, slid around by logo.js
             so the mark catches the same moving light as the logo. -->
        <linearGradient id="listen-chrome" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(35 .5 .5)">
          <stop offset="0"    stop-color="#f4f5f9"/>
          <stop offset="0.2"  stop-color="#a3a5af"/>
          <stop offset="0.36" stop-color="#3a3c43"/>
          <stop offset="0.47" stop-color="#cfd1d8"/>
          <stop offset="0.53" stop-color="#ffffff"/>
          <stop offset="0.64" stop-color="#8d8f99"/>
          <stop offset="0.82" stop-color="#45474e"/>
          <stop offset="1"    stop-color="#dfe0e6"/>
        </linearGradient>
        <radialGradient id="listen-spec" cx="0.35" cy="0.3" r="0.45">
          <stop offset="0"   stop-color="#fff" stop-opacity="0.9"/>
          <stop offset="0.35" stop-color="#fff" stop-opacity="0.25"/>
          <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path fill="url(#listen-chrome)" stroke="#1b1c20" stroke-width="0.25" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      <path fill="url(#listen-spec)" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
    </svg>
  </a>

  <button class="tilt-hint" id="tilt-hint" type="button" hidden>Tap, then tilt your phone</button>

  <script src="logo.js" defer></script>

</body>
</html>
