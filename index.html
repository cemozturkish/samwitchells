<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAM WITCHELLS</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <a href="music.html" class="music-nav">Music</a>

    <a href="merch.html" class="merch-nav">
      <img src="images/merch-button.png" alt="Merch">
    </a>
  </nav>

  <section class="home">
    <div class="home-logo-wrap" aria-label="SAM WITCHELLS silver logo">
      <img src="background.jpg" alt="SAM WITCHELLS logo" class="home-logo">
    </div>
  </section>

  <script>
    (function () {
      const logo = document.querySelector('.home-logo-wrap');
      if (!logo) return;

      const MAX_SHIFT = 15;
      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;
      let targetLightX = 50, targetLightY = 45;
      let currentLightX = 50, currentLightY = 45;
      let rafId = null;

      function animate() {
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;
        currentLightX += (targetLightX - currentLightX) * 0.12;
        currentLightY += (targetLightY - currentLightY) * 0.12;

        logo.style.transform = `translate(${currentX}px, ${currentY}px)`;
        logo.style.setProperty('--light-x', `${currentLightX}%`);
        logo.style.setProperty('--light-y', `${currentLightY}%`);

        if (
          Math.abs(targetX - currentX) > 0.05 ||
          Math.abs(targetY - currentY) > 0.05 ||
          Math.abs(targetLightX - currentLightX) > 0.05 ||
          Math.abs(targetLightY - currentLightY) > 0.05
        ) {
          rafId = requestAnimationFrame(animate);
        } else {
          rafId = null;
        }
      }

      function updateLogo(clientX, clientY) {
        const nx = (clientX / window.innerWidth) * 2 - 1;
        const ny = (clientY / window.innerHeight) * 2 - 1;
        targetX = -nx * MAX_SHIFT;
        targetY = -ny * MAX_SHIFT;

        const logoRect = logo.getBoundingClientRect();
        targetLightX = Math.max(0, Math.min(100, ((clientX - logoRect.left) / logoRect.width) * 100));
        targetLightY = Math.max(0, Math.min(100, ((clientY - logoRect.top) / logoRect.height) * 100));

        if (!rafId) rafId = requestAnimationFrame(animate);
      }

      window.addEventListener('mousemove', function (e) {
        updateLogo(e.clientX, e.clientY);
      });

      window.addEventListener('touchmove', function (e) {
        if (!e.touches.length) return;
        updateLogo(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
    })();
  </script>

</body>
</html>
