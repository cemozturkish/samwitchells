<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MERCH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="music.html" class="music-nav">Music</a>

    <a href="merch.html" class="merch-nav">
      <img src="images/merch-button.png" alt="Merch">
    </a>
  </nav>

  <section class="merch">
    <img src="images/merch-button.png" alt="Merch" class="merch-logo">
    <p class="merch-tagline">Physical fragments of the sound.</p>

    <div class="products-row">
      <div class="product">
        <img src="images/tshirt-black.jpg" alt="Artist T-Shirt" class="tshirt-image" data-black="images/tshirt-black.jpg" data-white="images/tshirt-white.jpg">
        <div class="color-options">
          <button type="button" class="color-swatch color-black active" aria-label="Black" data-color="black"></button>
          <button type="button" class="color-swatch color-white" aria-label="White" data-color="white"></button>
        </div>
        <h2>OH NO! TSHIRT</h2>
        <p>For those who immediately apologize.</p>
        <span class="coming-soon">Coming Soon</span>
      </div>

      <div class="product">
        <img src="images/necklace.jpg" alt="Necklace">
        <h2>BIG BAD BASS NECKLACE</h2>
        <p>For those who want to carry the big bad bass with them.</p>
        <span class="coming-soon">Coming Soon</span>
      </div>

      <div class="product">
        <img src="images/vinyl.jpg" alt="Vinyl Record">
        <h2>TURKISH ROYAL VINYL</h2>
        <p> 180g pressing. Analog warmth. </p>
        <span class="coming-soon">Coming Soon</span>
      </div>
    </div>

  </section>

  <script>
    document.querySelectorAll('.product').forEach(product => {
      const img = product.querySelector('.tshirt-image');
      if (!img) return;
      product.querySelectorAll('.color-swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          const color = btn.dataset.color;
          img.src = img.dataset[color];
          product.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    });
  </script>

</body>
</html>
