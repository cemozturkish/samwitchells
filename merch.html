<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERCH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="music-nav">Music</a>

    <a href="merch.html" class="merch-nav">
      <img src="images/merch-button.png" alt="Merch">
    </a>
  </nav>

  <section class="merch">
    <img src="images/merch-button.png" alt="Merch" class="merch-logo">
    <p class="merch-tagline">Physical fragments of the sound.</p>

    <div class="products-row">
      <div class="product">
        <img src="images/tshirt.jpg" alt="Artist T-Shirt">
        <h2>OH NO! TSHIRT</h2>
        <p>For those who immediately apologize.</p>
        <span class="coming-soon">Coming Soon</span>
      </div>

      <div class="product">
        <img src="images/rings.jpg" alt="3x Rings">
        <h2>BIG BAD BASS RINGS</h2>
        <p>For those who want to carry the big bad bass with them.</p>
        <span class="coming-soon">Coming Soon</span>
      </div>

      <div class="product">
        <img src="images/vinyl.jpg" alt="Vinyl Record">
        <h2>TURKISH ROYAL VINYL</h2>
        <p> 180g pressing. Analog warmth. </p>
        <span class="coming-soon">Coming Soon</span>
      </div>
    </div>

  </section>

</body>
</html>
